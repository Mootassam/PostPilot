<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostPilot — Social Media Scheduler</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='1' stop-color='%23c44dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M14 34 50 16 40 50 31 38 45 22 27 35z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="#fff" d="M3 12.5 21 4l-4.5 16-4-5.5L19 7.5 9.5 13z"/></svg></div>
      <div>PostPilot<small>Social media scheduler</small></div>
    </div>
    <div class="brand-switch" id="brandSwitch"></div>
    <button class="btn pri create" onclick="openComposer()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create post</button>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
  <main class="main">
    <header class="top">
      <button class="btn icon ghost hamb" onclick="toggleSide(true)" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
      <div class="top-title"><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <div class="top-right">
        <div id="topStatus"></div>
        <button class="btn icon ghost bell" id="bellBtn" title="Reminders" onclick="openReminders()"></button>
        <button class="btn icon ghost" id="themeBtn" title="Light / dark" onclick="toggleTheme()"></button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
<script src="/static/composer.js"></script>
<script src="/static/pages.js"></script>
<script src="/static/v11.js"></script>
</body>
</html>
